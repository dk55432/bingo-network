<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan a bingo card</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500&display=swap');

  :root {
    --ink: #1c2340;
    --paper: #f7f5ee;
    --card: #ffffff;
    --stamp-red: #b23a2f;
    --stamp-blue: #2a4d7a;
    --line: #d8d4c4;
    --muted: #6b6f80;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px 80px;
  }

  main { width: 100%; max-width: 420px; }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
  }

  .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 28px; }

  .upload-box {
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    padding: 28px 20px;
    text-align: center;
    background: var(--card);
    cursor: pointer;
  }

  .upload-box:hover { border-color: var(--stamp-blue); }

  .upload-box input { display: none; }

  .upload-label { font-weight: 500; font-size: 15px; }
  .upload-hint { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .status { font-size: 14px; color: var(--muted); margin: 16px 0; min-height: 20px; }

  #card {
    display: none;
    background: var(--card);
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 1px 2px rgba(28,35,64,0.06), 0 8px 24px rgba(28,35,64,0.06);
  }

  .headers, .row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .headers { margin-bottom: 6px; }

  .headers span {
    text-align: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--stamp-blue);
  }

  .row { margin-bottom: 6px; }

  .cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    background: var(--paper);
    border: 1.5px solid var(--line);
  }

  .cell input {
    width: 100%;
    height: 100%;
    text-align: center;
    border: none;
    background: transparent;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
    border-radius: 8px;
  }

  .cell input:focus { outline: 2px solid var(--stamp-blue); outline-offset: -2px; }

  .cell.flagged { border-color: var(--stamp-red); background: #fbeceb; }
  .cell.free { background: var(--stamp-blue); }
  .cell.free span { color: white; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 12px; }

  .legend {
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; color: var(--muted); margin-top: 14px;
  }
  .legend .swatch { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--stamp-red); background: #fbeceb; }

  button.confirm {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--stamp-red);
    color: white;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }

  button.confirm:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
  button.confirm:not(:disabled):hover { background: #9a3128; }

  .saved-note { font-size: 13px; color: var(--muted); text-align: center; margin-top: 12px; }

  .session-list {
    margin-top: 28px;
    display: none;
  }

  .session-list h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 10px;
  }

  .session-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }

  .scan-another {
    width: 100%;
    margin-top: 8px;
    padding: 12px;
    border: 1.5px solid var(--stamp-blue);
    border-radius: 10px;
    background: transparent;
    color: var(--stamp-blue);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }

  .done-link {
    display: block;
    width: 100%;
    text-align: center;
    margin-top: 12px;
    padding: 13px;
    border-radius: 10px;
    background: var(--ink);
    color: white;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
  }

  .no-player {
    background: #fbeceb;
    border: 1.5px solid var(--stamp-red);
    border-radius: 10px;
    padding: 14px;
    font-size: 14px;
    color: var(--stamp-red);
  }
</style>
</head>
<body>
<main>
  <h1>Scan a bingo card</h1>
  <p class="subtitle" id="subtitle">Take a photo, then fix any flagged numbers before saving.</p>
  <p class="subtitle" style="margin-top:-20px;">WebSocket Status: <span id="wsStatus">Disconnected</span></p>

  <div id="noPlayer" class="no-player" style="display:none;">
    No player found — open this page from the "Scan cards from phone" button on your player page.
  </div>

  <label class="upload-box" id="uploadBox">
    <input type="file" id="fileInput" accept="image/*" capture="environment">
    <div class="upload-label">Tap to take or choose a photo</div>
    <div class="upload-hint">Flat, well-lit, all four edges visible</div>
  </label>

  <div class="status" id="status"></div>

  <div id="card">
    <div class="headers">
      <span>B</span><span>I</span><span>N</span><span>G</span><span>O</span>
    </div>
    <div id="grid"></div>
    <div class="legend"><span class="swatch"></span> flagged — check this number</div>
    <button class="confirm" id="confirmBtn" disabled>Save card</button>
    <div class="saved-note" id="savedNote"></div>
  </div>

  <div class="session-list" id="sessionList">
    <h2>Cards scanned this session</h2>
    <div id="sessionCards"></div>
    <button class="scan-another" id="scanAnotherBtn">Scan another card</button>
    <a class="done-link" id="doneLink" href="#">Done — back to game</a>
  </div>
</main>

<script>
  // Same-origin, so this works whether the page is loaded as localhost
  // or a LAN IP (e.g. from a phone) — a hardcoded "http://localhost:8000"
  // here would silently break for anyone not on the host machine itself.
  const API_BASE = window.location.origin;
  const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";

  // Same identity player.html already keeps in localStorage — no URL
  // params needed, this page is only ever reached via the "Scan cards
  // from phone" button on that page, same browser, same storage.
  const playerId = localStorage.getItem("player_id");
  const gameId = localStorage.getItem("game_id");

  const fileInput = document.getElementById("fileInput");
  const uploadBox = document.getElementById("uploadBox");
  const noPlayerEl = document.getElementById("noPlayer");
  const subtitleEl = document.getElementById("subtitle");
  const wsStatusEl = document.getElementById("wsStatus");
  const statusEl = document.getElementById("status");
  const cardEl = document.getElementById("card");
  const gridEl = document.getElementById("grid");
  const confirmBtn = document.getElementById("confirmBtn");
  const savedNote = document.getElementById("savedNote");
  const sessionListEl = document.getElementById("sessionList");
  const sessionCardsEl = document.getElementById("sessionCards");
  const scanAnotherBtn = document.getElementById("scanAnotherBtn");
  const doneLink = document.getElementById("doneLink");

  const scannedThisSession = [];
  doneLink.href = "/player";

  if (!playerId || !gameId) {
    noPlayerEl.style.display = "block";
    uploadBox.style.display = "none";
  }

  // --- WebSocket: same connect/reconnect/heartbeat pattern as player.html,
  // host.html, join.html. Used only for saving a reviewed card onto the
  // player's actual card list (real game state) — the OCR step itself
  // stays a plain REST call below, since it's just "photo in, grid out"
  // with no game state involved, and file uploads are much simpler over
  // HTTP than WebSocket.
  let reconnectAttempts = 0;
  const MAX_DELAY = 30000;
  let socket;
  let missedPings = 0;
  const MAX_MISSED = 3;
  let heartbeatTimer;

  function connect() {
    if (!playerId || !gameId) return; // nothing to connect for
    socket = new WebSocket(`${protocol}//${window.location.host}/ws`);

    socket.onopen = () => {
      reconnectAttempts = 0;
      wsStatusEl.textContent = "Connected";
      socket.send(JSON.stringify({
        type: "reconnect",
        player_id: playerId,
        game_id: gameId
      }));
      startHeartbeat();
    };

    socket.onclose = () => {
      wsStatusEl.textContent = "Disconnected";
      scheduleReconnect();
      stopHeartbeat();
    };

    socket.onerror = (err) => {
      console.error("Socket error", err);
    };

    socket.onmessage = handleSocketMessage;
    return socket;
  }
  connect();

  function scheduleReconnect() {
    const delay = Math.min(1000 * 2 ** reconnectAttempts, MAX_DELAY);
    const jitter = delay * 0.3 * Math.random();
    reconnectAttempts++;
    setTimeout(connect, delay + jitter);
  }

  function startHeartbeat() {
    heartbeatTimer = setInterval(() => {
      missedPings++;
      if (missedPings > MAX_MISSED) {
        socket.close();
        return;
      }
      socket.send(JSON.stringify({ type: "ping" }));
    }, 10000);
  }

  function stopHeartbeat() {
    clearInterval(heartbeatTimer);
  }

  function handleSocketMessage(event) {
    const data = JSON.parse(event.data);

    if (data.type === "reconnected") {
      console.log("Reconnect successful");
    }
    else if (data.type === "reconnect_failed") {
      // Stale player_id/game_id (e.g. server restarted since we joined).
      localStorage.removeItem("player_id");
      window.location.href = "/join";
    }
    else if (data.type === "cards") {
      // Confirms the card we just sent was actually saved.
      const newest = data.cards[data.cards.length - 1];
      addToSessionList(newest);
      resetForNextScan();
    }
    else if (data.type === "action_rejected") {
      savedNote.textContent = `Error: ${data.reason}`;
      confirmBtn.disabled = false;
      confirmBtn.textContent = "Save card";
    }
    else if (data.type === "pong") {
      missedPings = 0;
    }
  }

  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    if (!file) return;

    statusEl.textContent = "Scanning…";
    cardEl.style.display = "none";
    savedNote.textContent = "";

    const formData = new FormData();
    formData.append("file", file);

    try {
      const res = await fetch(`${API_BASE}/scan-card`, { method: "POST", body: formData });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || "Scan failed");
      }
      const data = await res.json();
      renderGrid(data.grid);
      statusEl.textContent = data.needs_review
        ? "Some numbers need a check — flagged in red below."
        : "Looks good — review, then save.";
      cardEl.style.display = "block";
      confirmBtn.disabled = false;
    } catch (e) {
      statusEl.textContent = `Error: ${e.message}`;
    }
  });

  function renderGrid(grid) {
    gridEl.innerHTML = "";
    grid.forEach((row) => {
      const rowEl = document.createElement("div");
      rowEl.className = "row";
      row.forEach((cellData) => {
        const cellEl = document.createElement("div");
        cellEl.className = "cell";

        if (cellData.is_free_space) {
          cellEl.classList.add("free");
          cellEl.innerHTML = "<span>FREE</span>";
        } else {
          if (!cellData.valid) cellEl.classList.add("flagged");
          const input = document.createElement("input");
          input.type = "text";
          input.inputMode = "numeric";
          input.value = cellData.value ?? "";
          input.addEventListener("input", () => cellEl.classList.remove("flagged"));
          cellEl.appendChild(input);
        }
        rowEl.appendChild(cellEl);
      });
      gridEl.appendChild(rowEl);
    });
  }

  confirmBtn.addEventListener("click", () => {
    if (!socket || socket.readyState !== WebSocket.OPEN) {
      savedNote.textContent = "Not connected — waiting to reconnect, try again in a moment.";
      return;
    }

    const grid = [...gridEl.querySelectorAll(".row")].map((rowEl) =>
      [...rowEl.querySelectorAll(".cell")].map((cellEl) => {
        if (cellEl.classList.contains("free")) return null;
        const val = cellEl.querySelector("input").value.trim();
        return val === "" ? null : parseInt(val, 10);
      })
    );

    confirmBtn.disabled = true;
    confirmBtn.textContent = "Saving…";

    socket.send(JSON.stringify({
      type: "add_scanned_card",
      player_id: playerId,
      grid: grid
    }));
    // Response (a "cards" or "action_rejected" message) is handled in
    // handleSocketMessage above.
  });

  function addToSessionList(saved) {
    scannedThisSession.push(saved);
    sessionListEl.style.display = "block";
    const row = document.createElement("div");
    row.className = "session-card";
    row.innerHTML = `<span>Card #${saved.card_id}</span><span>saved</span>`;
    sessionCardsEl.appendChild(row);
  }

  function resetForNextScan() {
    cardEl.style.display = "none";
    fileInput.value = "";
    statusEl.textContent = `Saved. ${scannedThisSession.length} card(s) scanned this session.`;
    confirmBtn.disabled = false;
    confirmBtn.textContent = "Save card";
  }

  scanAnotherBtn.addEventListener("click", () => fileInput.click());
</script>
</body>
</html>
