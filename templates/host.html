<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bingo Host</title>
    <style>
        td.marked { background: yellow; }

        /* .hostBoard {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
        } */
    #hostBoard {
        max-height: 100vh;
        overflow-y: auto;
        }

.host-cell {
    width: 90px;
    white-space: nowrap;
    padding: 2px 4px;
    text-align: center;
}

.host-num {
    display: inline-block;
    width: 38px;
    text-align: center;
    font-size: 18px;
    cursor: pointer;
}

.host-num:hover {
    text-decoration: underline;
}

.marked { background-color: yellow; font-weight: bold; }


    </style>
    <link rel="icon" href="data:,">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

<h1>Bingo Host</h1>

<div id="currentNumber"
     style="
       font-size: 40px;
       font-weight: bold;
     ">
    ---
</div>

Called numbers: <div id="history"> --- </div>

<input id="numberInput" type="text" placeholder="Enter number">

<button id="previewButton">
    Preview
</button>

<div id="preview"></div>

<div id="gameStatus">Game Status: SETUP</div>

<div>
    Winning pattern:
    <select id="patternSelect" disabled></select>
</div>

<p>
WebSocket Status:
<span id="status">Disconnected</span>
</p>

<div id="joinLinkBox" style="display:none; margin: 10px 0; padding: 8px; border: 1px solid #ccc;
     align-items: center; justify-content: space-between; gap: 16px;">
    <div>
        Share this link with players:
        <br>
        <input id="joinLinkInput" type="text" readonly
               style="width: 320px;" onclick="this.select()">
        <button id="copyJoinLinkButton">Copy</button>
        <span id="copyJoinLinkStatus"></span>
    </div>
    <div id="joinQrCode"></div>
</div>

<button id="broadcastButton" disabled>
    Broadcast
</button>

<button id="setupNewGameButton">
    Setup New Game
</button>

<button id="startGameButton">
    Start Game
</button>

<button id="gameOverButton">
    Game Over
</button>

<div id="hostBoard"></div>

<script>

const GameStatus = Object.freeze({
    SETUP: "SETUP",
    IN_PROGRESS: "IN_PROGRESS",
    GAME_OVER: "GAME_OVER"
});
const GameStatusDisplay = Object.freeze({
    SETUP: "🟢 Waiting for players",
    IN_PROGRESS: "🔴 Game in progress",
    GAME_OVER: "🏁 Game over"
});
function gameStatusToText(status) {
    switch (status) {
        case GameStatus.SETUP:
            return "🟢 Waiting for players";

        case GameStatus.IN_PROGRESS:
            return "🔴 Game in progress";

        case GameStatus.GAME_OVER:
            return "🏁 Game over";

        default:
            return status;
    }
}

let pendingNumber = null;

let reconnectAttempts = 0;
const MAX_DELAY = 30000;
const protocol =
    window.location.protocol === "https:" ? "wss:" : "ws:";
let socket;
function connect() {
    socket = new WebSocket(
        `${protocol}//${window.location.host}/ws`
    );

    socket.onopen = () => {
        reconnectAttempts = 0;
        console.log("Host socket connected");

        const game_id = localStorage.getItem("game_id");
        if (game_id) {
            // Returning host — reattach to the existing game.
            socket.send(JSON.stringify({
                type: "host_reconnect",
                game_id: game_id
            }));
        } else {
            // First time this host has connected — spin up a new game.
            // Server responds with "game_created", which stores game_id.
            socket.send(JSON.stringify({ type: "create_game" }));
        }

        document.getElementById("status").textContent = "Connected";
        startHeartbeat(socket);
    };

    socket.onclose = (event) => {
        console.log("Socket closed", event.code, event.reason);
        scheduleReconnect();
        document.getElementById("status").textContent = "Disconnected";

        stopHeartbeat();
    };

    socket.onerror = (err) => {
        console.error("Socket error", err);
        // no reconnect call here — onclose will fire next
    };

    // Attached here (inside connect()) so every reconnect's new socket
    // instance gets a working message handler — previously this was set
    // once, outside connect(), on only the very first socket.
    socket.onmessage = handleHostSocketMessage;

    return socket;
}
connect();

function scheduleReconnect() {
  const delay = Math.min(1000 * 2 ** reconnectAttempts, MAX_DELAY);
  const jitter = delay * 0.3 * Math.random();
  reconnectAttempts++;
  setTimeout(connect, delay + jitter);
}

let missedPings = 0;
const MAX_MISSED = 3;
let heartbeatTimer;

function startHeartbeat(socket) {
  heartbeatTimer = setInterval(() => {
    missedPings++;
    if (missedPings > MAX_MISSED) {
      console.warn("Too many missed pongs, forcing reconnect");
      socket.close(); // triggers onclose -> reconnect
      return;
    }
    socket.send(JSON.stringify({ type: "ping" }));
  }, 10000); // every 10s
}


function stopHeartbeat() {
  clearInterval(heartbeatTimer);
}


function handleHostSocketMessage(event) {
    const data = JSON.parse(event.data);
    console.log("Received message from socket: ", JSON.stringify(data, null, 2));
    if (data.type === "reconnected") {
        console.log("Reconnect successful");
    }
    else if (data.type === "reconnect_failed") {
        console.error("ERROR: unhandled message: 'reconnect_failed'");
        // localStorage.removeItem("player_id");
        // window.location.href = "/";
    }
    else if (data.type === "host_reconnect_failed") {
        console.error("Host reconnect failed — game_id not found on server:", localStorage.getItem("game_id"));
        // Most likely cause: the server restarted since this game_id was
        // created (in-memory games are wiped on restart), so it's stale.
        // Clear it and send the host back to the decision page rather than
        // leaving them stuck on a host page with no working game.
        localStorage.removeItem("game_id");
        alert("This game session is no longer available on the server (it may have restarted). Please start a new game.");
        window.location.href = "/create_game";
    }
    else if (data.type === "host_reconnected") {
        console.log("Host reconnect successful");
        showJoinLink(localStorage.getItem("game_id"));
        populatePatternSelect(data.available_patterns);
    }
    else if (data.type === "game_created") {
        console.log("New game created:", data.game_id);
        localStorage.setItem("game_id", data.game_id);
        showJoinLink(data.game_id);
        populatePatternSelect(data.available_patterns);
    }
    else if (data.type === "history") {
        console.log("History:", data.called_numbers);
        let el = document.getElementById("hostBoard");
        el.innerHTML = "";
        drawHostBoardDoubles("hostBoard");

        // Re-mark every previously called number, not just the latest
        data.called_numbers.forEach(markCalledNumberHost);

        el = document.getElementById("history");
        el.innerText = data.called_numbers;
    }
    else if (data.type === "number_called") {
        document.getElementById("currentNumber").textContent =
            data.number;
        markCalledNumberHost(data.number);
    }
    else if (data.type === "new_game") {
        document.getElementById("currentNumber").textContent = "---";
    }
    else if (data.type === "game_started") {
        console.log("game_started")
        // TODO: What needs to be done here?  Disable / enable some buttons (Preview, Broadcast)?
    }
    else if (data.type === "game_status") {
        console.log("game_status: game status is now " + data.status)
        document.getElementById("gameStatus").innerText =
                                gameStatusToText(data.status);
        updatePatternSelectState(data.status, data.pattern_name);
    }
    else if (data.type === "action_rejected") {
        alert(data.action + ": " + data.reason)
    }
    else if (data.type === "winner") {
        console.log("WINNER!", data.winners);
        // alert("BINGO!");
        handle_winners(data.winners);
    } 
    else if (data.type === "pong") {
        console.log("received pong")
        missedPings = 0;
    }
    // catch-all
    else {
        console.error("ERROR: Unexpected request: "+data.type);
        return;
    }

}


function drawHostBoardDoubles(containerId = "hostBoard") {
  console.log("drawHostBoardDoubles: readyState=", document.readyState);
  const container = document.getElementById(containerId);
  console.log("found container?", !!container);
  if (!container) {
    console.error("Host board container not found:", containerId);
    return;
  }

  const cols = [
    { letter: "B", base: 1  },
    { letter: "I", base: 16 },
    { letter: "N", base: 31 },
    { letter: "G", base: 46 },
    { letter: "O", base: 61 },
  ];

  const rows = 8; // ceil(15/2)

  let html = '<table class="host-board">';
  html += "<tr>";
  html += cols.map(c => `<th>${c.letter}</th>`).join("");
  html += "</tr>";

  for (let r = 0; r < rows; r++) {
    html += "<tr>";
    for (const c of cols) {
      const n1 = c.base + r * 2;
      const n2 = n1 + 1;

      const show1 = n1 <= c.base + 14; // within 1..15 for that letter
      const show2 = n2 <= c.base + 14;

      html += `<td class="host-cell">
        ${show1 ? `<span class="host-num" data-bingo="${c.letter}${n1}">${n1}</span>` : ""}
        ${show2 ? `<span class="host-num" data-bingo="${c.letter}${n2}">${n2}</span>` : ""}
      </td>`;
    }
    html += "</tr>";
  }

  html += "</table>";
  container.innerHTML = html;

  container.querySelectorAll(".host-num").forEach(el => {

      el.onclick = function() {

          previewNumber(el.dataset.bingo);

      };

  });
}

function markCalledNumberHost(calledNumber) {
  const host = document.getElementById("hostBoard");
  host.querySelectorAll(`.host-num[data-bingo="${CSS.escape(calledNumber)}"]`)
      .forEach(el => el.classList.add("marked"));
}

const RANGES = { B: [1,15], I: [16,30], N: [31,45], G: [46,60], O: [61,75] };

function canonicalizeBingoCall(input) {
  // Accept either a single combined string ("g52", "N31") or separate letter/number
  let letter = "";
  let numberStr = "";

  const match = String(input).trim().match(/^([A-Za-z]?)(\d+)$/);
  if (!match) {
    console.error(`Invalid bingo call format: ${input}`);
    return null;
  }

  letter = match[1].toUpperCase();
  numberStr = match[2];
  const n = Number(numberStr);

  if (!letter) {
    // No letter given — derive it from the number
    letter = Object.keys(RANGES).find(l => n >= RANGES[l][0] && n <= RANGES[l][1]);
    if (!letter) {
      console.error(`Invalid bingo call: number ${n} is out of range 1-75`);
      return null;
    }
    return `${letter}${n}`;
  }

  // Letter given — validate it matches the number's range
  const range = RANGES[letter];
  if (!range || n < range[0] || n > range[1]) {
    console.error(`Invalid bingo call: ${letter}${n} is out of range`);
    return null;
  }

  return `${letter}${n}`;
}

function previewNumber(value) {

    pendingNumber = canonicalizeBingoCall(value);

    if (pendingNumber === null) {

        document.getElementById("preview").textContent =
            "Invalid number ? check the console for details.";

        document.getElementById("broadcastButton").disabled = true;

        return;
    }

    document.getElementById("numberInput").value = pendingNumber;

    document.getElementById("preview").textContent =
        "Ready to broadcast: " + pendingNumber;

    document.getElementById("broadcastButton").disabled = false;
}

function handle_winners(winners) {
    str = "The following card(s) have BINGO:\n";
    for (const winner of winners) {
        str += winner.display_name + " ";
        str += winner.card_id + "\n";
    }
    alert(str);
}

function showJoinLink(game_id) {
    if (!game_id) return;
    const link = `${window.location.origin}/join?game=${game_id}`;
    document.getElementById("joinLinkInput").value = link;
    document.getElementById("joinLinkBox").style.display = "flex";

    const qrContainer = document.getElementById("joinQrCode");
    qrContainer.innerHTML = ""; // clear any previous code before regenerating
    new QRCode(qrContainer, {
        text: link,
        width: 100,
        height: 100
    });
}

function populatePatternSelect(availablePatterns) {
    if (!availablePatterns) return;
    const select = document.getElementById("patternSelect");
    select.innerHTML = "";
    for (const name of availablePatterns) {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        select.appendChild(option);
    }
}

function updatePatternSelectState(status, patternName) {
    const select = document.getElementById("patternSelect");
    // Only adjustable during SETUP — once a game is in progress or over,
    // changing the win condition out from under it wouldn't mean anything
    // (cards are already dealt against whatever pattern was chosen then).
    select.disabled = (status !== GameStatus.SETUP);
    if (patternName && select.value !== patternName) {
        select.value = patternName;
    }
}

document.getElementById("patternSelect").onchange = function() {
    const message = {
        type: "set_winning_pattern",
        pattern_name: document.getElementById("patternSelect").value
    };
    socket.send(JSON.stringify(message));
};

document.getElementById("copyJoinLinkButton").onclick = async function() {
    const input = document.getElementById("joinLinkInput");
    const statusEl = document.getElementById("copyJoinLinkStatus");
    try {
        await navigator.clipboard.writeText(input.value);
        statusEl.textContent = "Copied!";
    } catch (e) {
        // clipboard API can fail (e.g. non-HTTPS context) — fall back to
        // manual select so the user can still Ctrl/Cmd+C it themselves.
        input.select();
        statusEl.textContent = "Press Ctrl+C to copy";
    }
    setTimeout(() => { statusEl.textContent = ""; }, 2000);
};


document.getElementById("previewButton").onclick = function() {

    previewNumber(
        document.getElementById("numberInput").value
    );

};


document.getElementById("broadcastButton").onclick = function() {
    const message = {
        type: "submit_number",
        value: pendingNumber
    };
    socket.send(JSON.stringify(message));
};

document.getElementById("setupNewGameButton").onclick = function() {
    console.log("setupNewGameButton: sending setup_new_game");
    const message = {
        type: "setup_new_game",
    };
    // Debug:  The readyState values are
    // 0 = CONNECTING
    // 1 = OPEN ✅
    // 2 = CLOSING
    // 3 = CLOSED
    console.log("setupNewGameButton: readyState=", socket.readyState);
    try {
        console.log("setupNewGameButton: about to send msg: ", message);
        socket.send(JSON.stringify(message));
        console.log("setupNewGameButton: send completed");
    }
    catch (e) {
        console.log("send failed: ", e)
    }
}

document.getElementById("startGameButton").onclick = function() {
    const message = {
        type: "start_game",
    };
    if (!socket || socket.readyState !== WebSocket.OPEN) {
        console.log("WebSocket not open; readyState=", socket?.readyState);
        return;
    }
    socket.send(JSON.stringify(message));
}

document.getElementById("gameOverButton").onclick = function() {
    const message = {
        type: "game_over",
    };
    socket.send(JSON.stringify(message));
}

window.addEventListener("DOMContentLoaded", () => {
  drawHostBoardDoubles("hostBoard");
});

</script>

</body>

</html>
