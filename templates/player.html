<body>

<h1>Bingo Player</h1>

        <button id="leaveGameButton">
            Leave Game
        </button>
<div id="card"></div>

<p>
Status:
<span id="status">Disconnected</span>
</p>

<div id="currentNumber"
     style="
       font-size: 80px;
       font-weight: bold;
     ">
    ---
</div>


<script>

const socket = new WebSocket("ws://127.0.0.1:8000/ws");

socket.onopen = function() {

    console.log("Player socket connected");
    
    const player_id = localStorage.getItem("player_id");
    socket.send(JSON.stringify({
        type: "reconnect",
        player_id: player_id
    }));

    document.getElementById("status").textContent =
        "Connected";

};


socket.onmessage = function(event) {

    const data = JSON.parse(event.data);

    if (data.type === "reconnected") {

        console.log("Reconnect successful");

    }
    else if (data.type === "reconnect_failed") {

        localStorage.removeItem("player_id");
        window.location.href = "/";

    }
    else if (data.type === "number_called") {

        document.getElementById("currentNumber").textContent =
            data.number;

    }
    else if (data.type === "history") {

        console.log("History:", data.called_numbers);

    }
    else if (data.type === "winner") {

        console.log("WINNER!", data.winners);

        alert("BINGO!");
    } 
    // TODO:  Change "card" to "cards"
    else if (data.type === "card") {
        console.log("Received card:", data.card);
    }
    else if (data.type === "card_update") {
        console.log("Updated card:", data.card);
    }
};


// socket.onclose = function() {

//     document.getElementById("status").textContent =
//         "Disconnected";

// };
socket.onclose = function() {
    console.log("Join WebSocket closed");
};

document.getElementById("leaveGameButton").onclick = function() {
    console.log("Pressed leaveGameButton")
    localStorage.removeItem("player_id");
    window.location.href = "/join";
}

</script>

</body>
