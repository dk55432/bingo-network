<!DOCTYPE html>
<html>
    <head>
        <link rel="icon" href="data:,">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            table {
                border-collapse: collapse;
            }

            td {

                width: 50px;
                height: 50px;

                border: 1px solid black;

                text-align: center;

                font-size: 24px;
            }

            .marked {

                background-color: yellow;
                font-weight: bold;
            }

            #cards {
                display: flex;
                overflow-x: auto;
                gap: 20px;
            }

            .bingo-card {
                flex: 0 0 auto;
            }

        </style> 
    </head>
<body>

<h1>Bingo Player</h1>

        <button id="leaveGameButton">
            Leave Game
        </button>
        <button id="testCards">Load test cards 1-3</button>
        <button id="disposeCards">Dispose of current cards</button>
        <button id="startFresh">Start fresh, forget previous session</button>
<p>
WebSocket Status:
<span id="status">Disconnected</span>
</p>
Game Status: <div id="gameStatus">Connecting...</div>
<p>Called Numbers: <span id="calledNumbers"></span></p>

<div id="currentNumber"
     style="
       font-size: 80px;
       font-weight: bold;
     ">
    ---
</div>

<div id="cards"></div>


<script>

const protocol =
    window.location.protocol === "https:" ? "wss:" : "ws:";

const socket = new WebSocket(
    `${protocol}//${window.location.host}/ws`
);

socket.onopen = function() {
    console.log("Player socket connected");
    const player_id = localStorage.getItem("player_id");
    socket.send(JSON.stringify({
        type: "reconnect",
        player_id: player_id
    }));
    document.getElementById("status").textContent = "Connected";
    console.log("Requesting game status");
    socket.send(JSON.stringify({
        type: "request_game_status"
    }));
};

socket.onclose = function() {
    console.log("Join WebSocket closed");
    document.getElementById("status").textContent = "Disconnected";
    console.log("onclose: Do I need to wipe out the cache and redirect?");
};

socket.onmessage = function(event) {
    const data = JSON.parse(event.data);
    if (data.type === "reconnected") {
        console.log("Reconnect successful");
    }
    else if (data.type === "reconnect_failed") {
        console.log("reconnect_failed, redirecting to login page.")
        localStorage.removeItem("player_id");
        window.location.href = "/join";
    }
    else if (data.type === "number_called") {
        console.log("number_called: ", data.number);
        showCurrentNumber(data.number);
    }
    else if (data.type === "history") {
        console.log("History:", data.called_numbers);
        document.getElementById("calledNumbers").textContent= data.called_numbers;
    }
    else if (data.type === "winner") {
        console.log("WINNER!", data.winners);
        handle_winners(data.winners);
        // alert("BINGO!");
    } 
    else if (data.type === "cards") {
        console.log("Received cards:", data.cards);
        draw_cards(data.cards)
    }
    else if (data.type === "cards_update") {
        alert("cards_update is DEPRECATED, fix this server call")
    }
    else if (data.type === "left") {
        console.log("Received 'left' message, shutting down..")
        localStorage.removeItem("player_id");
        socket.close();
        window.location.href = "/join";
    }
    else if (data.type === "new_game") {
        console.log("new_game");
        document.getElementById("currentNumber").textContent = "---";
        document.getElementById("calledNumbers").textContent= "";
        draw_cards( [] )
    }
    else if (data.type === "game_status") {
        document.getElementById("gameStatus").innerText =
            "Game Status: "+data.status;
            //TODO: disable / enable anything?
            // Update our status monitor
            document.getElementById("gameStatus").innerText=data.status;
    }
    else if (data.type === "action_rejected") {
        alert(data.action + ": " + data.reason)
    }
};


document.getElementById("leaveGameButton").onclick = function() {
    console.log("Pressed leaveGameButton, sending 'leave' msg to server.")
    const player_id = localStorage.getItem("player_id");
    socket.send(JSON.stringify({
        type: "leave",
        player_id: player_id
    }));
}

document.getElementById("disposeCards").onclick = function() {
    console.log("pressed disposeCards")
    const player_id = localStorage.getItem("player_id");
    socket.send(JSON.stringify({
        type: "dispose_cards",
        player_id: player_id,
    }));
}

document.getElementById("startFresh").onclick = function() {
    console.log("pressed startFresh");
    // Tell the server we're leaving, so it can clean up on its end.
    const player_id = localStorage.getItem("player_id");
    socket.send(JSON.stringify({
        type: "leave",
        player_id: player_id,
    }));
    localStorage.removeItem("player_id");
    window.location.href = "/join";
}


// TODO: This test-card handler goes away when we add OCR scanning.
document.getElementById("testCards").onclick = function() {
    console.log("pressed load test cards")
    const player_id = localStorage.getItem("player_id");
    socket.send(JSON.stringify({
        type: "load_test_cards",
        player_id: player_id,
        number: "1"   // DAVE: the number is ignored on the server, it loads all 3.
    }));
}

function showCurrentNumber(number) {
    document.getElementById("currentNumber").textContent = number;
}

function draw_cards(cards) {
    const container = document.getElementById("cards");
    container.innerHTML = "";

    for (const card of cards) {
        const cardDiv = document.createElement("div");
        cardDiv.className = "bingo-card";
        draw_card(card, cardDiv);
        container.appendChild(cardDiv);
    }
}

function draw_card(card, container) {
    let html = "";
    html += "<table>";

    html += "<tr>";
    html += "<th>B</th>";
    html += "<th>I</th>";
    html += "<th>N</th>";
    html += "<th>G</th>";
    html += "<th>O</th>";
    html += "</tr>";

        for (let row = 0; row < 5; row++) {
        html += "<tr>";
        for (let col = 0; col < 5; col++) {
            // If cell is Marked, attach "marked" class for CSS.
            if (card.marked[row][col]) {
                html += '<td class="marked">';
            }
            else {
                html += "<td>";
            }
            html += card.grid[row][col];
            html += "</td>";
        }
        html += "</tr>";
    }
    html += "</table>";

    container.innerHTML = html;
}

function handle_winners(winners) {
    let str = "";
    const myPlayerId = localStorage.getItem("player_id");
    const myWins = winners.filter(
        winner => winner.player_id === myPlayerId
    );
    if (myWins.length > 0) {
        str += "BINGO! You won on these cards:\n";
        for (const myWin of myWins) {
            str += myWin.card_id + "\n";
        }
        alert(str);
    } else {
        str = "BINGO called by:\n";
        for (const winner of winners) {
            str += winner.display_name + " ";
            str += winner.card_id + "\n";
        }
        // showMessage(str);
        // document.getElementById("gameStatus").innerText = str;
        document.getElementById("currentNumber").innerText = str;
    }
}
</script>

</body>
</html>
