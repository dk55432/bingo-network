<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="icon" href="data:,">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            table {
                border-collapse: collapse;
            }

            td {
                width: 50px;
                height: 50px;
                border: 1px solid black;
                text-align: center;
                font-size: 24px;
            }

            #cards {
                display: flex;
                overflow-x: auto;
                gap: 20px;
            }

            .bingo-card {
                border-collapse: collapse;
            }

            .bingo-card th,
            .bingo-card td {
                border: 1px solid black;
                text-align: center;
                padding: 4px;
            }

            .card-title {
                font-size: 1.2em;
                font-weight: bold;
                background: #ddd;
            }

            /* Marked cells carry three cues — yellow fill, a leading
               checkmark, thicker border — so the state is never conveyed
               by colour alone (color-blind safe). */
            td.marked,
            .bingo-card td.marked {
                background-color: #ffe600;
                border: 3px solid #000;
                font-weight: bold;
            }

            /* High-contrast current-number display (pure black on white,
               ~21:1 contrast ratio). */
            .current-number {
                font-size: 120px;
                line-height: 1;
                font-weight: 800;
                color: #000;
                background: #fff;
                border: 6px solid #000;
                padding: 12px 24px;
                display: inline-block;
                min-width: 3.5ch;
                text-align: center;
                margin: 8px 0;
            }

            h2 {
                font-size: 1.4em;
                margin: 12px 0 4px;
            }

            .remaining {
                font-weight: normal;
            }

            /* Visually-hidden text targeted at screen readers only. */
            .sr-only {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
                clip-path: inset(50%);
                white-space: nowrap;
                border: 0;
            }
        </style> 
    </head>
<body>

<h1>Bingo Player</h1>

        <button id="leaveGameButton">
            Leave Game
        </button>
        <button id="testCard1">Load test card 1</button>
        <button id="testCard2">Load test card 2</button>
        <button id="testCard3">Load test card 3</button>
        <button id="disposeCards">Dispose of current cards</button>
        <button id="startFresh">Start fresh, forget previous session</button>
        <button id="scanCardButton">Scan cards from phone</button>
<p>
WebSocket Status:
<span id="status">Disconnected</span>
</p>
Game Status: <div id="gameStatus" role="status" aria-live="polite">Connecting...</div>
Winning Pattern: <span id="patternName">---</span>
<p>Called Numbers: <span id="calledNumbers" aria-live="polite"></span></p>

<h2>Current number</h2>
<div id="currentNumber"
     class="current-number"
     role="status"
     aria-live="assertive"
     aria-atomic="true">
    ---
</div>

<div id="cards"></div>


<script>
const GameStatus = Object.freeze({
    SETUP: "SETUP",
    IN_PROGRESS: "IN_PROGRESS",
    GAME_OVER: "GAME_OVER"
});
const GameStatusDisplay = Object.freeze({
    SETUP: { emoji: "🟢", text: "Waiting for players" },
    IN_PROGRESS: { emoji: "🔴", text: "Game in progress" },
    GAME_OVER: { emoji: "🏁", text: "Game over" }
});
// Decorates the status string with its emoji hidden from screen readers
// (the emoji is decorative; the text carries the meaning).
function gameStatusToText(status) {
    const l = GameStatusDisplay[status];
    if (!l) return status;
    return `<span aria-hidden="true">${l.emoji}</span><span>${l.text}</span>`;
}

let reconnectAttempts = 0;
const MAX_DELAY = 30000;
const protocol =
    window.location.protocol === "https:" ? "wss:" : "ws:";
let socket;

function connect() {
    socket = new WebSocket(
        `${protocol}//${window.location.host}/ws`
    );

    socket.onopen = () => {
        reconnectAttempts = 0;
        console.log("Player socket connected");
        document.getElementById("status").textContent = "Connected";
        requestCatchUp(socket);
        startHeartbeat(socket);
    };

    socket.onclose = (event) => {
        console.log("Socket closed", event.code, event.reason);
        scheduleReconnect();
        document.getElementById("status").textContent = "Disconnected";
        stopHeartbeat();
    };

    socket.onerror = (err) => {
        console.error("Socket error", err);
        // no reconnect call here — onclose will fire next
    };

    // Attached here (inside connect()) rather than once at top level, so
    // every reconnect's new socket instance gets a working message handler.
    // Previously this was set once, outside connect(), on the very first
    // socket only — after the first reconnect, incoming messages had
    // nowhere to go.
    socket.onmessage = handleSocketMessage;

    return socket;
}
connect();

function scheduleReconnect() {
  const delay = Math.min(1000 * 2 ** reconnectAttempts, MAX_DELAY);
  const jitter = delay * 0.3 * Math.random();
  reconnectAttempts++;
  setTimeout(connect, delay + jitter);
}

let missedPings = 0;
const MAX_MISSED = 3;
let heartbeatTimer;

function startHeartbeat(socket) {
  heartbeatTimer = setInterval(() => {
    missedPings++;
    if (missedPings > MAX_MISSED) {
      console.warn("Too many missed pongs, forcing reconnect");
      socket.close();
      return;
    }
    socket.send(JSON.stringify({ type: "ping" }));
  }, 10000);
}

function stopHeartbeat() {
  clearInterval(heartbeatTimer);
}

// --- accessibility helpers ---

function vibrate(pattern) {
  if (typeof navigator !== "undefined" && navigator.vibrate) {
    try { navigator.vibrate(pattern); } catch (e) {}
  }
}

function markCell(td) {
  if (td.classList.contains("marked")) return;
  td.classList.add("marked");
  const value = td.dataset.bingo || td.textContent.replace(/\s*✓\s*/g, "").trim();
  td.setAttribute("aria-label", value + ", marked");
  if (!td.querySelector(".tick")) {
    const tick = document.createElement("span");
    tick.className = "tick";
    tick.setAttribute("aria-hidden", "true");
    tick.textContent = " ✓";
    td.appendChild(tick);
  }
}

function updateRemainingCounts() {
  document.querySelectorAll(".bingo-card").forEach(cardEl => {
    const unmarked = cardEl.querySelectorAll("td:not(.marked)").length;
    const label = cardEl.dataset.cardLabel || "Card";
    const milabel = cardEl.querySelector(".remaining");
    if (milabel) milabel.textContent = `${unmarked} to go`;
    const cap = cardEl.querySelector("caption");
    if (cap) cap.textContent = `${label}, ${unmarked} unmarked numbers remaining`;
  });
}

function requestCatchUp(socket) {
  const player_id = localStorage.getItem("player_id");
  const game_id = localStorage.getItem("game_id");
  socket.send(JSON.stringify({
      type: "reconnect",
      player_id: player_id,
      game_id: game_id
  }));
  // Server responds to "reconnect" with "reconnected"/"reconnect_failed",
  // "history", and "cards". game_status isn't part of that bundle, so it's
  // still requested explicitly.
  socket.send(JSON.stringify({ type: "request_game_status" }));
}

function handleSocketMessage(event) {
    const data = JSON.parse(event.data);
    if (data.type === "reconnected") {
        console.log("Reconnect successful");
    }
    else if (data.type === "reconnect_failed") {
        console.log("reconnect_failed, redirecting to login page.")
        localStorage.removeItem("player_id");
        window.location.href = "/join";
    }
    else if (data.type === "number_called") {
        console.log("number_called: ", data.number);
        showCurrentNumber(data.number);
        vibrate(200);
        markCalledNumber(data.number);
        updateRemainingCounts();
    }
    else if (data.type === "history") {
        console.log("History:", data.called_numbers);
        document.getElementById("calledNumbers").textContent= data.called_numbers;
        mark_cards(data.called_numbers);
        updateRemainingCounts();
    }
    else if (data.type === "winner") {
        console.log("WINNER!", data.winners);
        handle_winners(data.winners);
    } 
    else if (data.type === "cards") {
        console.log("Received cards:", data.cards);
        draw_cards(data.cards)
        updateRemainingCounts();
    }
    else if (data.type === "left") {
        console.log("Received 'left' message, shutting down..")
        localStorage.removeItem("player_id");
        socket.close();
        window.location.href = "/join";
    }
    else if (data.type === "new_game") {
        console.log("new_game");
        document.getElementById("currentNumber").textContent = "---";
        document.getElementById("calledNumbers").textContent= "";
        draw_cards( [] )
    }
    else if (data.type === "game_status") {
        document.getElementById("gameStatus").innerHTML =
            gameStatusToText(data.status);
        if (data.pattern_name) {
            document.getElementById("patternName").textContent = data.pattern_name;
        }
        handle_game_status(data.status);
    }
    else if (data.type === "action_rejected") {
        alert(data.action + ": " + data.reason)
    }
    else if (data.type === "pong") {
        console.log("received pong")
        missedPings = 0;
    }
    // catch-all
    else {
        console.error("ERROR: Unexpected request: "+data.type);
        return;
    }
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    // tab woke up — socket may be stale even if it looks "open"
    if (socket.readyState !== WebSocket.OPEN) {
      connect();
    } else {
      requestCatchUp(socket); // cheap insurance
    }
  }
});

window.addEventListener("online", () => {
  if (socket.readyState !== WebSocket.OPEN) connect();
});


document.getElementById("leaveGameButton").onclick = function() {
    console.log("Pressed leaveGameButton, sending 'leave' msg to server.")
    const player_id = localStorage.getItem("player_id");
    socket.send(JSON.stringify({
        type: "leave",
        player_id: player_id
    }));
}

document.getElementById("disposeCards").onclick = function() {
    console.log("pressed disposeCards")
    const player_id = localStorage.getItem("player_id");
    socket.send(JSON.stringify({
        type: "dispose_cards",
        player_id: player_id,
    }));
}

document.getElementById("startFresh").onclick = function() {
    console.log("pressed startFresh");
    // Tell the server we're leaving, so it can clean up on its end.
    const player_id = localStorage.getItem("player_id");
    socket.send(JSON.stringify({
        type: "leave",
        player_id: player_id,
    }));
    localStorage.removeItem("player_id");
    localStorage.removeItem("game_id");
    window.location.href = "/join";
}


// TODO: This test-card handler goes away when we add OCR scanning.
document.getElementById("testCard1").onclick = function() {
    console.log("pressed load test cards")
    const player_id = localStorage.getItem("player_id");
    socket.send(JSON.stringify({
        type: "load_test_cards",
        player_id: player_id,
        number: "1"  
    }));
}
document.getElementById("testCard2").onclick = function() {
    console.log("pressed load test cards")
    const player_id = localStorage.getItem("player_id");
    socket.send(JSON.stringify({
        type: "load_test_cards",
        player_id: player_id,
        number: "2"  
    }));
}
document.getElementById("testCard3").onclick = function() {
    console.log("pressed load test cards")
    const player_id = localStorage.getItem("player_id");
    socket.send(JSON.stringify({
        type: "load_test_cards",
        player_id: player_id,
        number: "3"  
    }));
}

document.getElementById("scanCardButton").onclick = function() {
  console.log("pressed scanCardButton");
  const player_id = localStorage.getItem("player_id");
  const game_id = localStorage.getItem("game_id");
  window.location.href = `/scan?game_id=${game_id}&player_id=${player_id}`;
};

function showCurrentNumber(number) {
    document.getElementById("currentNumber").textContent = number;
}

function draw_cards(cards) {
    const container = document.getElementById("cards");
    container.innerHTML = "";

    // let n=0;
    for (const card of cards) {
        const cardDiv = document.createElement("div");
        cardDiv.className = "bingo-card";
        // n++;
        let n = card.card_id;
        draw_card(card, cardDiv, n);
        container.appendChild(cardDiv);
    }
}


function draw_card(card, container, number) {
  let html = "";
  html += `<table class="bingo-card" data-card-label="Card ${number}">`;
  // Screen-reader-only caption; the visual header row also shows the
  // live "N to go" count (updated in updateRemainingCounts()).
  html += `<caption class="sr-only">Card ${number}</caption>`;
  html += `<tr><th scope="colgroup" colspan="5">Card ${number} <span class="remaining"></span></th></tr>`;

  html += "<tr>";
  html += "<th scope=\"col\">B</th><th scope=\"col\">I</th><th scope=\"col\">N</th><th scope=\"col\">G</th><th scope=\"col\">O</th>";
  html += "</tr>";

  for (let row = 0; row < 5; row++) {
    html += "<tr>";
    for (let col = 0; col < 5; col++) {
      const value = card.grid[row][col]; // e.g. "G52"
      const isMarked = card.marked[row][col];
      const state = isMarked ? "marked" : "not marked";
      const tick = isMarked ? ' <span class="tick" aria-hidden="true">✓</span>' : '';

      html += `<td data-bingo="${value}"${isMarked ? ' class="marked"' : ''} aria-label="${value}, ${state}">${value}${tick}</td>`;
    }
    html += "</tr>";
  }

  html += "</table>";
  container.innerHTML = html;
}

function mark_cards(called_numbers) {
  const container = document.getElementById("cards");

  for (const num of called_numbers) {
    container
      .querySelectorAll(`td[data-bingo="${CSS.escape(num)}"]`)
      .forEach(markCell);
  }
}


function markCalledNumber(calledNumber) {
  const container = document.getElementById("cards");

  container
    .querySelectorAll(`td[data-bingo="${CSS.escape(calledNumber)}"]`)
    .forEach(markCell);
}

function handle_winners(winners) {
    let str = "";
    const myPlayerId = localStorage.getItem("player_id");
    const myWins = winners.filter(
        winner => winner.player_id === myPlayerId
    );
   
    str = "BINGO called by:";
    // for (const winner of winners) {
    //     str += winner.display_name + " ";
        // str += winner.card_id + "\n";
    // }
    const names = winners.map(w => w.display_name);
    str += names.join(", ");
    // showMessage(str);
    // document.getElementById("gameStatus").innerText = str;
    document.getElementById("currentNumber").innerText = str;
   
    if (myWins.length > 0) {
        vibrate([200, 100, 200]); // distinct pattern: YOU won
        str = "BINGO! You won on these cards:\n";
        for (const myWin of myWins) {
            str += "Card " + myWin.card_id + "\n";
        }
        alert(str);
    } else {
        vibrate(100);
    }
}

function handle_game_status(status) {
    // Test-card loading and disposal only make sense during SETUP —
    // the server already rejects load_test_cards outside SETUP, this just
    // keeps the buttons from inviting an action that'll be rejected.
    const setupOnlyButtons = [
        document.getElementById("testCard1"),
        document.getElementById("testCard2"),
        document.getElementById("testCard3"),
        document.getElementById("disposeCards")
    ];
    const isSetup = status === GameStatus.SETUP;
    setupOnlyButtons.forEach(btn => btn.disabled = !isSetup);
}
</script>

</body>
</html>
