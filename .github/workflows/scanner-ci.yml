name: scanner-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
          pip install -r requirements-cnn.txt

      - name: Scanner golden regression
        run: python -m pytest test_scan_regression.py -v

  persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Game-state persistence round-trip
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
          python -m pytest test_persistence.py test_learning_audit.py -v