# systemd drop-in for fastapi-bingo.service (Orange Pi / any always-on host).
#
# Install on the Pi (idempotent):
#   sudo mkdir -p /etc/systemd/system/fastapi-bingo.service.d
#   sudo cp deploy/fastapi-bingo.service.d/override.conf \
#       /etc/systemd/system/fastapi-bingo.service.d/override.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart fastapi-bingo.service
#
# IMPORTANT: keep each Environment= line to ONE assignment.  A single quoted
# line like  Environment="READER=cnn PATH=..."
# sets ONE variable literally named READER (value "cnn PATH=..."), so
# bingo_scan.py's `os.environ.get("READER") != "cnn"` and the scan silently
# falls back to the legacy tesseract reader.

[Service]
Environment=READER=cnn
Environment=PATH=/home/dietpi/bingo-network/.venv/bin